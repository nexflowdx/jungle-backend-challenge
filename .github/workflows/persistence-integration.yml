name: Milestones 3–7.2 PostgreSQL and SQS Integration

on:
  workflow_dispatch:
    inputs:
      zero_spend_confirmed:
        description: 'Confirmo orçamento do Actions de US$ 0,00 com Stop usage ativado'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  persistence:
    # Operator declaration, as in the approved compatibility workflow.
    if: ${{ inputs.zero_spend_confirmed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: infra/persistence/compose.yaml
      COMPOSE_PROJECT_NAME: persistence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate disposable database password
        shell: bash
        run: |
          set +x
          set -euo pipefail
          persistence_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "${persistence_password}"
          printf 'DIAGNOSTIC_DB_PASSWORD=%s\n' "${persistence_password}" >> "${GITHUB_ENV}"

      - name: Validate isolated Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s docker compose config --quiet

      - name: Build and verify types, bootstrap and local tests with pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 300s docker compose --progress plain build --pull persistence-tests

      - name: Start disposable PostgreSQL and SQS emulator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s docker compose up --detach --wait --wait-timeout 60 postgres ministack

      - name: Test persistence, opening, identity, atomic BET, WIN, LOSS, references, REFUND, ROLLBACK, historical results, HTTP contracts, atomicity, three-process concurrency and atomic SQS inbox/ACK
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s docker compose run --rm --no-deps -T persistence-tests

      - name: Verify pending reference batch against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 60s docker compose run --rm --no-deps -T \
            persistence-tests bun scripts/run-pending-references.ts

      - name: Verify periodic pending reference worker shutdown
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose run --rm --no-deps -d \
            persistence-tests bun scripts/run-pending-references-loop.ts)"
          trap 'docker stop --time 5 "$container_id" >/dev/null 2>&1 || true' EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = "true"
          docker stop --time 10 "$container_id" >/dev/null

      - name: Diagnose failure without credentials
        if: ${{ failure() && env.DIAGNOSTIC_DB_PASSWORD != '' }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          timeout --signal=KILL 10s bash -euo pipefail <<'BASH' || true
          docker compose ps --all
          docker compose logs --no-color --tail 60 postgres 2>&1 |
            while IFS= read -r log_line || [[ -n "${log_line}" ]]; do
              printf '%s\n' "${log_line//${DIAGNOSTIC_DB_PASSWORD}/[REDACTED]}"
            done
          BASH

      - name: Remove disposable resources
        if: ${{ always() && env.DIAGNOSTIC_DB_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 30s docker compose down --volumes --remove-orphans --timeout 5
