name: CI Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Verify Bun version
        shell: bash
        run: |
          bun_version="$(bun --version)"
          echo "Bun version: ${bun_version}"
          if [[ "${bun_version}" != '1.4.4' ]]; then
            echo "::error::Expected Bun 1.4.4, got ${bun_version}"
            exit 1
          fi
